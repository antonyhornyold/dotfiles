onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "top"
hide_tab_bar_when_single_tab = true
tab_bar_right = [
  { type = "command", command = "python3 ~/.config/herdr/workspace-status.py", interval_seconds = 1, timeout_seconds = 2 },
  { type = "zoom" },
  { type = "datetime", format = "%d %b %H:%M" },
]
tab_bar_right_separator = " · "
