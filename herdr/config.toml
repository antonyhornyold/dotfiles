onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
surface_dim = "#313244"
sidebar_bg = "#181825"

[ui]
sidebar_width = 24
sidebar_min_width = 18
sidebar_max_width = 30
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
agent_panel_sort = "priority"
accent = "#313244"
pane_scrollbars = false
pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "top"
hide_tab_bar_when_single_tab = true
tab_bar_right = [
  { type = "command", command = "python3 ~/.config/herdr/workspace-status.py", interval_seconds = 1, timeout_seconds = 2 },
  { type = "zoom" },
  { type = "command", command = "python3 ~/.config/herdr/battery-status.py", interval_seconds = 60, timeout_seconds = 2 },
  { type = "datetime", format = "%d %b %H:%M" },
]
tab_bar_right_separator = " · "

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent"]]
